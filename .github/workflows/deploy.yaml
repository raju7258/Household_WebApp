name: "Terraform CI"
description: "Runs Terraform CI"
on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy to"
        required: true
        default: "dev"
  push:
    branches:
      - dev
env:
  ENVIRONMENT: ${{ inputs.environment }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1

      - name: Terraform Init
        run: terraform init -backend-config="./envs/${ENVIRONMENT}/${ENVIRONMENT}.config"

      - name: Terraform Plan
        run: terraform plan -var-file="./envs/${ENVIRONMENT}/${ENVIRONMENT}.tfvars" -var="environment=${ENVIRONMENT}"

      - name: Terraform Apply
        run: terraform apply -var-file="./envs/${ENVIRONMENT}/${ENVIRONMENT}.tfvars" -var="environment=${ENVIRONMENT}" -auto-approve